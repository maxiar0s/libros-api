services:
  springboot:
    build:
      context: .
      dockerfile: Dockerfile.springboot
    environment:
      ORACLE_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      ORACLE_USERNAME: ${ORACLE_USERNAME:?Set ORACLE_USERNAME in .env}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD in .env}
      PORT: "8080"
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    depends_on:
      oracle:
        condition: service_healthy

  oracle:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # The base image's ORACLE_PASSWORD configures SYS/SYSTEM, not APP_USER.
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASSWORD:?Set ORACLE_ADMIN_PASSWORD in .env}
      APP_USER: ${ORACLE_USERNAME:?Set ORACLE_USERNAME in .env}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD in .env}
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh && test -f /opt/oracle/oradata/.library-schema-ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    shm_size: "1gb"

volumes:
  oracle-data:
