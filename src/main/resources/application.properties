spring.application.name=libros
spring.config.import=optional:file:./.env[.properties]
server.port=${PORT:8080}

# Supply a local Oracle JDBC URL or an Oracle Cloud URL with TNS_ADMIN for a wallet connection.
spring.datasource.url=${ORACLE_URL}
spring.datasource.username=${ORACLE_USERNAME}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Create the schema manually using database/oracle-schema.sql. Never drop existing data.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
